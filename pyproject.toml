[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "pathtool"
version = "1!0.0.1787193084"
description = "Common path related functions"
authors = [
    { name = "Justin Keogh", email = "github.com@v6y.net" },
]
license = "ISC"
dependencies = [
    "eprint @ git+https://github.com/jakeogh/eprint@6ee1deca0c24b684eb5093247d6bd22e11f1b057",
    "hs @ git+https://github.com/jakeogh/hs@b33c88f35cd24e773fea6ca4758193c9e815536d",
]
requires-python = ">=3.11"

[project.urls]
Homepage = "https://github.com/jakeogh/pathtool"

[tool.setuptools]
include-package-data = true
zip-safe = false

[tool.setuptools.package-data]
pathtool = [
    "py.typed",
]
